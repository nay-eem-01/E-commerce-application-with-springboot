spring.profiles.active = ${SPRING_PROFILES_ACTIVE:development}

# Local secrets. Git-ignored; see .env.example for every key. In staging and production
# the same names come from real environment variables, so the import is optional.
spring.config.import = optional:file:./.env[.properties],optional:file:../.env[.properties]

# ------- common ------- #

# Schema is owned by Flyway. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto = validate
spring.jpa.open-in-view = false
spring.flyway.enabled = true
spring.flyway.locations = classpath:db/migration

spring.datasource.url = ${DB_URL}
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}
spring.jpa.properties.hibernate.jdbc.time_zone = UTC

spring.mvc.throw-exception-if-no-handler-found = true
spring.web.resources.add-mappings = false
spring.jackson.default-property-inclusion = always
spring.jackson.serialization.write-dates-as-timestamps = false
spring.servlet.multipart.enabled = false
server.error.whitelabel.enabled = false
server.error.include-message = never
server.error.include-stacktrace = never
spring.security.filter.dispatcher-types = request

# Behind a reverse proxy, resolve the client IP from a trusted X-Forwarded-For (per-IP limits).
server.forward-headers-strategy = ${FORWARD_HEADERS_STRATEGY:none}

# No default for the secret: the application must refuse to start without it.
app.jwt.secret = ${JWT_SECRET}
app.jwt.access-token-expiry = 15m
app.jwt.refresh-token-expiry = 30d

app.otp.ttl = 5m
app.otp.max-attempts = 5
app.otp.resend-cooldown = 60s
app.sms.provider = ${SMS_PROVIDER:console}

app.initial-admin.email = ${INITIAL_ADMIN_EMAIL:}
app.initial-admin.password = ${INITIAL_ADMIN_PASSWORD:}

app.cors.allowed-origins = ${CORS_ALLOWED_ORIGINS}

# Delivery charges (BDT) and coverage. Changing a fee is a config change.
app.delivery.inside-fee = 70
app.delivery.outside-fee = 130
app.delivery.free-threshold = 3000
app.delivery.inside-districts = Dhaka
app.delivery.districts = Dhaka,Gazipur,Narayanganj,Chattogram,Cox's Bazar,Cumilla,Sylhet,Rajshahi,Khulna,Barishal,Rangpur,Mymensingh,Bogura,Jashore
app.delivery.inside-estimate = 1 to 2 days
app.delivery.outside-estimate = 2 to 4 days

# Payments. enabled-methods: what checkout offers. routes: which provider serves each online
# method - switching vendor is changing one value (e.g. PAYMENT_ROUTE_BKASH=sslcommerz).
# Providers: bkash (direct), sslcommerz (cards, banks, bKash, Nagad), fake (development only).
# Startup fails if an enabled method's provider is missing, unsupported or has no credentials.
app.payment.enabled-methods = ${PAYMENT_ENABLED_METHODS:COD}
app.payment.routes.BKASH = ${PAYMENT_ROUTE_BKASH:bkash}
app.payment.routes.NAGAD = ${PAYMENT_ROUTE_NAGAD:sslcommerz}
app.payment.routes.CARD = ${PAYMENT_ROUTE_CARD:sslcommerz}
# Public URL of this API (providers call back here) and the storefront's result page.
app.payment.callback-base-url = ${APP_BASE_URL:http://localhost:8080}
app.payment.return-url = ${PAYMENT_RETURN_URL:http://localhost:5173/checkout/result}
# Unpaid online orders are cancelled and restocked after this long.
app.payment.pending-ttl = 30m

# Vendor credentials: environment only, no defaults. Sandbox base URLs in .env.example.
app.payment.bkash.base-url = ${BKASH_BASE_URL:}
app.payment.bkash.app-key = ${BKASH_APP_KEY:}
app.payment.bkash.app-secret = ${BKASH_APP_SECRET:}
app.payment.bkash.username = ${BKASH_USERNAME:}
app.payment.bkash.password = ${BKASH_PASSWORD:}
app.payment.sslcommerz.base-url = ${SSLCOMMERZ_BASE_URL:}
app.payment.sslcommerz.store-id = ${SSLCOMMERZ_STORE_ID:}
app.payment.sslcommerz.store-password = ${SSLCOMMERZ_STORE_PASSWORD:}
app.payment.sslcommerz.fallback-email = ${SSLCOMMERZ_FALLBACK_EMAIL:}

# Order emails (transactional outbox). provider: smtp | log. "log" writes emails to the log
# instead of sending them; production warns loudly if it is left on "log".
app.mail.provider = ${MAIL_PROVIDER:log}
app.mail.from = ${MAIL_FROM:Senpai Supply <orders@senpai.local>}
app.mail.brand-name = ${MAIL_BRAND_NAME:Senpai Supply}
app.mail.storefront-url = ${STOREFRONT_URL:http://localhost:5173}
app.mail.staff-address = ${MAIL_STAFF_ADDRESS:}
app.mail.dispatch-interval = PT15S
app.mail.retention = 30d

# SMTP (used when MAIL_PROVIDER=smtp). Credentials from the environment only.
spring.mail.host = ${MAIL_HOST:}
spring.mail.port = ${MAIL_PORT:587}
spring.mail.username = ${MAIL_USERNAME:}
spring.mail.password = ${MAIL_PASSWORD:}
# Authenticated SMTP with STARTTLS (Gmail, SES, Mailgun...). Set MAIL_SMTP_AUTH=false for a
# relay that takes no credentials: with auth on and no username every send fails.
spring.mail.properties.mail.smtp.auth = ${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable = ${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout = 5000
spring.mail.properties.mail.smtp.timeout = 10000
spring.mail.properties.mail.smtp.writetimeout = 10000
# No SMTP host configured must not mark the app unhealthy.
management.health.mail.enabled = false

springdoc.swagger-ui.path = /swagger-ui.html
springdoc.swagger-ui.operationsSorter = method
springdoc.swagger-ui.docExpansion = none

# Actuator: health and info only, in every environment.
management.endpoints.web.exposure.include = health,info
management.endpoint.health.show-details = never
management.endpoint.health.probes.enabled = true

logging.level.root = INFO
logging.level.com.ecommerce = INFO
logging.level.org.hibernate = WARN
logging.level.org.hibernate.SQL = WARN

app.name = @project.name@

# Every log line carries the request's correlation id and user id (never personal data).
logging.pattern.level = %5p [%X{correlationId:-}] [user:%X{userId:-}]
