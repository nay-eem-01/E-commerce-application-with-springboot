spring.profiles.active = ${SPRING_PROFILES_ACTIVE:development}

# Local secrets. Git-ignored; see .env.example for every key. In staging and production
# the same names come from real environment variables, so the import is optional.
spring.config.import = optional:file:./.env[.properties],optional:file:../.env[.properties]

# ------- common ------- #

# Schema is owned by Flyway. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto = validate
spring.jpa.open-in-view = false
spring.flyway.enabled = true
spring.flyway.locations = classpath:db/migration

spring.datasource.url = ${DB_URL}
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}
spring.jpa.properties.hibernate.jdbc.time_zone = UTC

spring.mvc.throw-exception-if-no-handler-found = true
spring.web.resources.add-mappings = false
spring.jackson.default-property-inclusion = always
spring.jackson.serialization.write-dates-as-timestamps = false
spring.servlet.multipart.enabled = false
server.error.whitelabel.enabled = false
server.error.include-message = never
server.error.include-stacktrace = never
spring.security.filter.dispatcher-types = request

# Behind a reverse proxy, resolve the client IP from a trusted X-Forwarded-For (per-IP limits).
server.forward-headers-strategy = ${FORWARD_HEADERS_STRATEGY:none}

# No default for the secret: the application must refuse to start without it.
app.jwt.secret = ${JWT_SECRET}
app.jwt.access-token-expiry = 15m
app.jwt.refresh-token-expiry = 30d

app.otp.ttl = 5m
app.otp.max-attempts = 5
app.otp.resend-cooldown = 60s
app.sms.provider = ${SMS_PROVIDER:console}

app.initial-admin.email = ${INITIAL_ADMIN_EMAIL:}
app.initial-admin.password = ${INITIAL_ADMIN_PASSWORD:}

app.cors.allowed-origins = ${CORS_ALLOWED_ORIGINS}

# Delivery charges (BDT) and coverage. Changing a fee is a config change.
app.delivery.inside-fee = 70
app.delivery.outside-fee = 130
app.delivery.free-threshold = 3000
app.delivery.inside-districts = Dhaka
app.delivery.districts = Dhaka,Gazipur,Narayanganj,Chattogram,Cox's Bazar,Cumilla,Sylhet,Rajshahi,Khulna,Barishal,Rangpur,Mymensingh,Bogura,Jashore
app.delivery.inside-estimate = 1 to 2 days
app.delivery.outside-estimate = 2 to 4 days

# Only COD has a gateway today; add BKASH, NAGAD or CARD once its gateway class exists.
app.payment.enabled-methods = COD

springdoc.swagger-ui.path = /swagger-ui.html
springdoc.swagger-ui.operationsSorter = method
springdoc.swagger-ui.docExpansion = none

# Actuator: health and info only, in every environment.
management.endpoints.web.exposure.include = health,info
management.endpoint.health.show-details = never
management.endpoint.health.probes.enabled = true

logging.level.root = INFO
logging.level.com.ecommerce = INFO
logging.level.org.hibernate = WARN
logging.level.org.hibernate.SQL = WARN

app.name = @project.name@

# Every log line carries the request's correlation id and user id (never personal data).
logging.pattern.level = %5p [%X{correlationId:-}] [user:%X{userId:-}]
