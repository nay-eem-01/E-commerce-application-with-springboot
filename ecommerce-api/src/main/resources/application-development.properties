server.port = 8080
app.back-end-url = http://localhost:${server.port}

# The demo catalog (repeatable, idempotent) loads only here.
spring.flyway.locations = classpath:db/migration,classpath:db/dev-seed

logging.level.com.ecommerce = DEBUG

# Online payments work locally through the fake provider (no vendor account needed).
# Override with PAYMENT_ENABLED_METHODS / PAYMENT_ROUTE_* to try a real sandbox.
app.payment.enabled-methods = ${PAYMENT_ENABLED_METHODS:COD,BKASH,CARD}
app.payment.routes.BKASH = ${PAYMENT_ROUTE_BKASH:fake}
app.payment.routes.CARD = ${PAYMENT_ROUTE_CARD:fake}
