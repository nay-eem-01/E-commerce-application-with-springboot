server.port = ${PORT:8080}
app.back-end-url = ${APP_BASE_URL}
server.forward-headers-strategy = native

# Swagger is off in production.
springdoc.api-docs.enabled = false
springdoc.swagger-ui.enabled = false

logging.level.com.ecommerce = INFO

# Capped retention so logs never fill the disk.
logging.file.name = ${LOG_FILE:logs/ecommerce-api.log}
logging.logback.rollingpolicy.max-file-size = 50MB
logging.logback.rollingpolicy.max-history = 14
logging.logback.rollingpolicy.total-size-cap = 1GB

# Product images: a bucket and the public URL they are served from are required (no local disk in production).
app.storage.s3.bucket = ${S3_BUCKET}
app.storage.public-base-url = ${UPLOADS_PUBLIC_BASE_URL}
